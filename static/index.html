<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Finder</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#12182b;--mute:#5d667d;--line:#d6dbe6;--accent:#3d3df5;--accent-ink:#fff;--code:#e4e8f1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--panel:#181c30;--ink:#eceffa;--mute:#98a1bd;--line:#2a3050;--accent:#8b8bff;--accent-ink:#0f1220;--code:#222845}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:40px 18px 64px}
h1{font:700 2.4rem/1.1 Georgia,"Iowan Old Style",serif;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px}
.bar{display:flex;gap:10px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:12px 14px;background:var(--panel);color:var(--ink)}
input{flex:1;min-width:0}
button{cursor:pointer}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{margin:12px 0 0;color:var(--mute)}
summary{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(3,1fr) 2fr;gap:10px;margin-top:10px}
.opts label{font-size:.85rem;display:block}
.opts input{width:100%;margin-top:4px}
@media(max-width:620px){.opts{grid-template-columns:1fr 1fr}.bar{flex-direction:column}}
#status{margin:20px 0 4px;color:var(--mute)}
#status.err{color:#d6293e}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.head{display:flex;justify-content:space-between;gap:12px}
.title{font-weight:700}
.score{font-weight:700;color:var(--accent)}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0 8px}
.hook{font-family:Georgia,serif;font-size:1.05rem;margin:8px 0}
.why{color:var(--mute);font-size:.92rem;margin:0 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{padding:8px 12px;font-size:.92rem}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:12px;background:#000}
.saved{font-size:.9rem;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Clip Finder</h1>
<p class="sub">Paste a YouTube link. Get the best moments, ready to preview and cut.</p>

<div class="bar">
  <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="YouTube link">
  <button class="go" id="go">Find clips</button>
</div>
<details>
  <summary>Options</summary>
  <div class="opts">
    <label>Min seconds<input id="min" type="number" value="20" min="5"></label>
    <label>Max seconds<input id="max" type="number" value="60" min="10"></label>
    <label>Clips<input id="n" type="number" value="10" min="1" max="15"></label>
    <label>Style (optional)<input id="style" placeholder="funny, strong opinions, tips…"></label>
  </div>
  <div style="margin-top:10px;display:flex;gap:18px;flex-wrap:wrap">
    <label><input id="vert" type="checkbox" checked style="width:auto"> Vertical 9:16</label>
    <label><input id="caps" type="checkbox" checked style="width:auto"> Burn in captions</label>
  </div>
</details>

<div id="status" role="status"></div>
<div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const out = $("out"), statusEl = $("status"), go = $("go");
const ts = s => { s = Math.round(s); const m = Math.floor(s/60), r = s%60; return m+":"+String(r).padStart(2,"0"); };
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? "err" : ""; };

let key = sessionStorage.getItem("cfkey") || "";
async function post(path, body, retry = true){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json","X-Access-Key":key}, body:JSON.stringify(body)});
  if (r.status === 401 && retry) {
    const k = prompt("Enter your access password");
    if (k) { key = k; sessionStorage.setItem("cfkey", k); return post(path, body, false); }
  }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}

go.onclick = async () => {
  const url = $("url").value.trim();
  if (!url) { say("Paste a YouTube link first.", true); return; }
  go.disabled = true; out.textContent = ""; say("Fetching the transcript and picking clips. This takes about 20 seconds.");
  try {
    const res = await post("/api/clips", {url, min:+$("min").value, max:+$("max").value, n:+$("n").value, style:$("style").value});
    say("Found " + res.clips.length + " clips.");
    res.clips.forEach((c, i) => out.append(card(c, i, res.video_id, url)));
  } catch(e) { say(e.message, true); }
  go.disabled = false;
};
$("url").addEventListener("keydown", e => { if (e.key === "Enter") go.click(); });

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function card(c, i, vid, url){
  const s = Math.round(c.start_sec), e = Math.round(c.end_sec);
  const box = el("div", "clip");
  const head = el("div", "head");
  head.append(el("div", "title", (i+1)+". "+c.title), el("div", "score", c.score+"/10"));
  const meta = el("div", "meta", ts(s)+" to "+ts(e)+" ("+(e-s)+" seconds)");
  const hook = el("div", "hook", "“"+c.hook+"”");
  const why = el("p", "why", c.reason);
  const acts = el("div", "acts");
  const saved = el("div", "saved");
  const prev = el("button", null, "Preview");
  prev.onclick = () => {
    let f = box.querySelector("iframe");
    if (f) { f.remove(); prev.textContent = "Preview"; return; }
    f = el("iframe");
    f.src = "https://www.youtube.com/embed/"+vid+"?start="+s+"&end="+e+"&autoplay=1";
    f.allow = "autoplay; encrypted-media; fullscreen";
    box.append(f); prev.textContent = "Close preview";
  };
  const cut = el("button", null, "Make clip");
  cut.onclick = async () => {
    cut.disabled = true; saved.textContent = "Downloading and rendering. This takes a minute…";
    try {
      const r = await post("/api/cut", {url, start:s, end:e, vertical:$("vert").checked, captions:$("caps").checked});
      const a = el("a", null, "Download " + r.file); a.href = r.url + "?key=" + encodeURIComponent(key);
      saved.textContent = ""; saved.append(a);
    }
    catch(err){ saved.textContent = err.message; }
    cut.disabled = false;
  };
  acts.append(prev, cut);
  box.append(head, meta, hook, why, acts, saved);
  return box;
}
</script>
</body>
</html>
